<main><nav aria-label="Etapy dnia" id="steps"></nav><div class="heading"><div><div class="eyebrow" id="phase"></div><h1 id="title"></h1><p id="description"></p></div><span id="status" class="pill"></span></div><section id="content"></section><p id="notice" class="notice" role="status"></p></main><footer><div class="foot"><button id="back">← Wstecz</button><div class="context" id="context"></div><button class="primary" id="next"></button></div></footer>
<dialog id="modal" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button id="cancel">Anuluj</button><button id="save" class="primary">Potwierdź</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),names=['Zapas z wczoraj','Produkcja nocna','Produkcja dzisiaj','Stan sklepu','Przygotuj jutro','Zamknij dzień'];
const products=[{id:1,name:'Chleb wiejski',cat:'Chleby',life:'MSL',unit:'szt.',carry:8,night:0,production:0,waste:0,checked:false,required:true},{id:2,name:'Brownie',cat:'Ciasta',life:'LSL',unit:'szt.',carry:6,night:0,production:0,waste:0,checked:false},{id:3,name:'Sernik',cat:'Ciasta',life:'MSL',unit:'kg',carry:1.5,night:0,production:0,waste:0,checked:false},{id:4,name:'Bułka pszenna',cat:'Pieczywo',life:'SSL',unit:'szt.',carry:0,night:0,production:20,waste:0,checked:true,required:true,prep:0},{id:5,name:'Bagietka',cat:'Bagietki',life:'SSL',unit:'szt.',carry:0,night:0,production:0,waste:0,checked:true,required:true,prep:0}];
products.forEach(p=>p.initialCarry=p.carry);
let stage=0,furthest=0,opened=false,closed=false,shelf='SSL',editId=4,dialogAction=null;const e=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};const b=(text,fn,cls)=>{const n=e('button',text,cls);n.type='button';n.onclick=fn;return n;};const number=n=>Number(n.toFixed(4)),available=p=>number(p.carry+p.night+p.production-p.waste),opening=p=>number(p.carry+p.night+p.production);function productCell(p){const td=e('td'),name=e('div',(p.required?'🔒 ':'')+p.name,'name'),sub=e('div',undefined,'sub');sub.append(e('span',p.life,'life '+p.life.toLowerCase()),document.createTextNode(p.cat));td.append(name,sub);return td;}
function stepper(value,unit,onChange,max=9999,locked=false){const wrap=e('div',undefined,'qty');for(const n of [-10,-5,-1,0,1,5,10]){if(!n){const input=e('input');input.type='number';input.min=0;input.max=max;input.step=unit==='kg'?'0.0001':'1';input.value=value;input.disabled=locked;input.setAttribute('aria-label','Ilość w '+unit);input.onfocus=()=>input.select();input.onchange=()=>{let v=Number(input.value);if(!Number.isFinite(v))v=0;if(unit!=='kg')v=Math.round(v);onChange(number(Math.max(0,Math.min(max,v))));};wrap.append(input);}else{const btn=b((n>0?'+':'−')+Math.abs(n),()=>onChange(number(Math.max(0,Math.min(max,value+n)))));btn.disabled=locked;btn.setAttribute('aria-label',(n>0?'Dodaj ':'Odejmij ')+Math.abs(n)+' '+unit);wrap.append(btn);}}return wrap;}
function panel(headers,label){const panel=e('div',undefined,'panel'),top=e('div',undefined,'panel-title');top.append(e('strong',label),e('span','Piekarnia'));const table=e('table',undefined,'rows'),head=e('thead'),tr=e('tr'),body=e('tbody');for(const h of headers)tr.append(e('th',h));head.append(tr);table.append(head,body);panel.append(top,table);$('content').append(panel);return {panel,body};}
function hint(text){$('content').append(e('div',text,'hint'));}function reasonButtons(parent,values,current,choose){const box=e('div',undefined,'reasons');for(const val of values){const btn=b(val,()=>choose(val));btn.setAttribute('aria-pressed',String(val===current));box.append(btn);}parent.append(box);}
function showDialog(title,build,save){$('modalTitle').textContent=title;$('modalBody').replaceChildren();$('save').disabled=false;$('save').textContent='Potwierdź';build($('modalBody'));dialogAction=save;$('modal').showModal();}function closeDialog(){$('modal').close();dialogAction=null;}$('cancel').onclick=closeDialog;$('save').onclick=()=>{if(dialogAction)dialogAction();};
function dispose(p,onDone){let quantity=1,reason='Upływ terminu ważności',photo=false;showDialog('Wycofaj · '+p.name,body=>{body.append(e('p','Wskaż ilość, powód i zdjęcie. Pozostała ilość przejdzie do sprzedaży.'));const control=e('div');function qty(){control.replaceChildren(stepper(quantity,p.unit,v=>{quantity=v;qty();validate();},p.carry));}qty();body.append(control);const reasonBox=e('div');function reasons(){reasonBox.replaceChildren();reasonButtons(reasonBox,['Upływ terminu ważności','Uszkodzenie','Jakość','Degustacja','Inny powód'],reason,v=>{reason=v;reasons();});}reasons();body.append(reasonBox);const upload=e('div',undefined,'photo'),file=e('input');file.type='file';file.accept='image/*';file.setAttribute('capture','environment');file.setAttribute('aria-label','Zdjęcie odpadu');file.onchange=()=>{photo=!!file.files.length;validate();};upload.append(e('p','Zdjęcie odpadu'),file);body.append(upload);function validate(){$('save').disabled=!photo||quantity<=0;}validate();},()=>{p.carry=number(p.carry-quantity);p.checked=true;closeDialog();onDone();});}
function render(){const scroll=window.scrollY;$('content').replaceChildren();$('notice').textContent='';$('steps').replaceChildren();names.forEach((name,i)=>{const btn=b('',()=>{stage=i;render();});btn.append(e('b',closed?'✓':i<stage?'✓':String(i+1)),e('span',name));btn.disabled=i>furthest||(opened&&i<3)||closed;if(i===stage)btn.setAttribute('aria-current','step');$('steps').append(btn);});$('phase').textContent=stage<3?'Otwarcie dnia · krok '+(stage+1)+' z 3':stage===3?'W trakcie dnia':stage===4?'Przed zamknięciem':'Zakończenie dnia';$('status').textContent=closed?'Dzień zamknięty':opened?'Dzień otwarty':'Dzień nieotwarty';$('status').className='pill '+(opened?'green':'wine');const titles=['Sprawdź, co zostało z wczoraj','Czy coś skończyło się po zamknięciu?','Dodaj dzisiejszą produkcję','Bieżący stan sklepu','Co przygotowujesz na jutro?','Co zostaje, a co wyrzucasz?'];const descriptions=['Potwierdź stan i jakość. Wycofaj produkty, które nie nadają się do sprzedaży.','Wpisz tylko gotowe produkty, których nie było jeszcze w stanie na zamknięciu.','Stan na otwarciu = zapas po kontroli + produkcja nocna + dzisiejsza.','Tu wracasz w trakcie zmiany, aby dopisać produkcję lub zgłosić odpad.','Zapis przygotowania na 30 października. Ilość oddzielona od sprzedaży dzisiaj.','SSL wycofujemy w całości. Przy MSL i LSL wskaż ilość odpadu.'];$('title').textContent=titles[stage];$('description').textContent=descriptions[stage];$('back').disabled=stage===0||(opened&&stage===3)||closed;$('next').disabled=false;
if(stage===0){const {body}=panel(['Produkt','Zamknięcie D−1','Do sprzedaży','Decyzja'],'Zapas do sprawdzenia');for(const p of products.filter(p=>p.carry>0||!p.checked)){const row=e('tr');row.append(productCell(p),e('td',p.initialCarry+' '+p.unit,'num'),e('td',p.carry+' '+p.unit,'num'));const action=e('td');action.append(b(p.checked?'✓ Sprawdzone':'Stan zgodny',()=>{p.checked=true;render();},p.checked?'good':''),document.createTextNode(' '),b('Wycofaj',()=>dispose(p,render),'soft'));row.append(action);body.append(row);}const remaining=products.filter(p=>!p.checked).length;$('context').innerHTML='<strong>'+remaining+' do sprawdzenia</strong> Potwierdzenie nie dodaje ponownie zapasu.';$('next').textContent='Dalej · produkcja nocna →';$('next').disabled=remaining>0;}
if(stage===1){hint('Nie było produkcji po zamknięciu? Zostaw zera i przejdź dalej. Produkcja w toku nie jest jeszcze gotowym produktem.');const {panel:box,body}=panel(['Produkt','Gotowe po zamknięciu','Dodaj ilość'],'Produkcja niezapisana wczoraj');const p=products.find(p=>p.id===editId),row=e('tr');row.append(productCell(p),e('td','+'+p.night+' '+p.unit,'num'));const td=e('td');td.append(stepper(p.night,p.unit,v=>{p.night=v;render();}));row.append(td);body.append(row);const add=e('div',undefined,'add'),select=e('select');select.setAttribute('aria-label','Produkt z produkcji nocnej');for(const item of products){const o=e('option',item.name);o.value=item.id;o.selected=item.id===editId;select.append(o);}select.onchange=()=>{editId=Number(select.value);render();};add.append(select,e('small','Np. wypiek ukończony o 01:00'));box.append(add);for(const item of products.filter(p=>p.night>0&&p.id!==editId))box.append(e('p',item.name+' · +'+item.night+' '+item.unit));$('context').innerHTML='<strong>Produkcja zakończona po zamknięciu</strong> Zostanie dodana przy otwarciu.';$('next').textContent='Dalej · dzisiejsza produkcja →';}
if(stage===2){const {body}=panel(['Produkt','Nowa produkcja','Na otwarciu'],'Asortyment na dzisiaj');for(const p of products){const row=e('tr'),qty=e('td');qty.append(stepper(p.production,p.unit,v=>{p.production=v;if(opening(p)>0)p.absence=null;render();}));row.append(productCell(p),qty,e('td',opening(p)+' '+p.unit,'num'));body.append(row);if(p.required&&opening(p)===0){const r=e('tr',undefined,'exception'),td=e('td');td.colSpan=3;td.append(e('p','Obowiązkowy produkt jest niedostępny. Dlaczego nie został wyprodukowany?'));reasonButtons(td,['Brak składników','Awaria sprzętu','Brak czasu','Inny powód'],p.absence,v=>{p.absence=v;render();});if(p.absence==='Inny powód'){const t=e('textarea');t.placeholder='Opisz przyczynę';t.value=p.absenceText||'';t.setAttribute('aria-label','Inny powód braku produktu '+p.name);t.oninput=()=>{p.absenceText=t.value;validateOpening();};td.append(t);}r.append(td);body.append(r);}}const add=e('div',undefined,'add');add.append(e('small','Nie ma produktu na liście?'),b('+ Dodaj produkt',()=>{if(products.some(p=>p.id===6))return;products.push({id:6,name:'Chleb z ziarnami',cat:'Chleby',life:'MSL',unit:'szt.',carry:0,night:0,production:0,waste:0,checked:true});render();},'soft'));$('content').querySelector('.panel').append(add);validateOpening();$('next').textContent='Potwierdź i otwórz dzień';}
if(stage===3){const stats=e('div',undefined,'stats');for(const [label,value]of [['Produkty dostępne',products.filter(p=>available(p)>0).length],['Braki obowiązkowe',products.filter(p=>p.required&&!available(p)).length],['Przygotowanie jutra','30 paź']]){const s=e('div',undefined,'stat');s.append(e('small',label),e('strong',String(value)));stats.append(s);}$('content').append(stats);const {body}=panel(['Produkt','Dostępne teraz','Działanie'],'Stan na żywo · przykład');for(const p of products){const row=e('tr'),td=e('td');td.append(b('Zmień stan',()=>adjust(p),'soft'));row.append(productCell(p),e('td',available(p)+' '+p.unit,'num'),td);body.append(row);}$('context').innerHTML='<strong>Możesz pracować na tym ekranie przez cały dzień.</strong> Do jutra i zamknięcia przejdź, gdy będziesz gotowy.';$('next').textContent='Przygotuj jutro →';}
if(stage===4){hint('To osobna ewidencja przygotowania na jutro. Powiązanie flag produktu wymaga uzgodnienia: kod używa tutaj is_pdb, mail nazywa to PDM.');const {body}=panel(['Produkt','Przygotowane na jutro','Przeznaczenie'],'Przygotowanie · przykład listy');for(const p of products.filter(p=>p.prep!==undefined)){const row=e('tr'),td=e('td');td.append(stepper(p.prep,p.unit,v=>{p.prep=v;render();}));row.append(productCell(p),td,e('td','30 października'));body.append(row);}$('context').innerHTML='<strong>Ten krok można pominąć.</strong> Zera oznaczają brak przygotowania na jutro.';$('next').textContent='Dalej · zamknięcie →';}
if(stage===5&&!closed){const tabs=e('div',undefined,'tabs');for(const code of ['SSL','MSL','LSL'])tabs.append(b(code,()=>{shelf=code;render();},shelf===code?'active':''));$('content').append(tabs);hint(shelf==='SSL'?'Cały pozostały stan SSL zostanie odpadem. Ilość jest zablokowana.':'Wpisz ilość do wyrzucenia. Pozostała ilość przejdzie na jutro.');const {body}=panel(['Produkt','Odpad','Na jutro'],'Rozliczenie pozostałości');for(const p of products.filter(p=>p.life===shelf&&available(p)>0)){const waste=p.life==='SSL'?available(p):(p.closingWaste||0),row=e('tr'),td=e('td');td.append(stepper(waste,p.unit,v=>{p.closingWaste=v;p.proof=false;render();},available(p),p.life==='SSL'));row.append(productCell(p),td,e('td',number(available(p)-waste)+' '+p.unit,'num'));body.append(row);}if(!body.children.length){const row=e('tr'),td=e('td','Brak produktów w tej grupie.','empty');td.colSpan=3;row.append(td);body.append(row);}const pending=products.filter(p=>(p.life==='SSL'?available(p):(p.closingWaste||0))>0);$('context').innerHTML='<strong>'+pending.length+' produktów do potwierdzenia</strong> Następnie wybierzesz powody i zdjęcia odpadu.';$('next').textContent='Potwierdź odpady i zamknij';}
if(closed){$('content').replaceChildren();const done=e('div',undefined,'panel center');done.append(e('h2','✓ Dzień zamknięty'),e('p','Odpady rozliczone. Pozostałości czekają na jutrzejszą kontrolę.'),e('p','To koniec demonstracji — nic nie zapisano w systemie.'),b('Zacznij demonstrację od nowa',()=>location.reload(),'soft'));$('content').append(done);$('context').textContent='Demonstracja zakończona';$('next').textContent='Zamknięto';$('next').disabled=true;}
window.scrollTo(0,scroll);}
function validateOpening(){const missing=products.filter(p=>p.required&&opening(p)===0&&(!p.absence||(p.absence==='Inny powód'&&!p.absenceText?.trim())));$('context').innerHTML='<strong>'+(missing.length?missing.length+' brak obowiązkowy do wyjaśnienia':'Asortyment sprawdzony')+'</strong> Zapas, nocny wypiek i produkcja są liczone osobno.';$('next').disabled=missing.length>0;}
function adjust(p){let mode='production',v=1;showDialog('Zmień stan · '+p.name,body=>{const tabs=e('div',undefined,'tabs'),control=e('div');function draw(){tabs.replaceChildren();for(const [key,text]of [['production','Dodaj produkcję'],['waste','Zgłoś odpad']])tabs.append(b(text,()=>{mode=key;draw();},mode===key?'active':''));control.replaceChildren(stepper(v,p.unit,n=>{v=n;draw();},mode==='waste'?available(p):9999));$('save').textContent=mode==='waste'?'Dalej · powód i zdjęcie':'Dodaj produkcję';}body.append(tabs,control);draw();},()=>{if(v<=0)return;if(mode==='production'){p.production=number(p.production+v);closeDialog();render();}else{closeDialog();showWaste(p,v);}});}
function showWaste(p,v){let reason='Jakość',photo=false;showDialog('Odpad · '+p.name,body=>{body.append(e('p',v+' '+p.unit+' do wyrzucenia'));reasonButtons(body,['Upływ terminu ważności','Uszkodzenie','Jakość','Degustacja','Inny powód'],reason,v=>{reason=v;[...body.querySelectorAll('.reasons button')].forEach(n=>n.setAttribute('aria-pressed',String(n.textContent===v)));});const file=e('input');file.type='file';file.accept='image/*';file.setAttribute('aria-label','Zdjęcie odpadu');file.onchange=()=>{photo=!!file.files.length;$('save').disabled=!photo;};body.append(e('p','Dodaj zdjęcie odpadu'),file);$('save').disabled=true;},()=>{p.waste=number(p.waste+v);closeDialog();render();});}
function confirmClosing(){const pending=products.filter(p=>(p.life==='SSL'?available(p):(p.closingWaste||0))>0&&!p.proof);if(!pending.length){closed=true;render();return;}const p=pending[0];let reason=p.life==='SSL'?'Upływ terminu ważności':'',photo=false;showDialog('Potwierdź odpad · '+p.name,body=>{body.append(e('p','Produkt '+(products.filter(p=>p.proof).length+1)+' · odpad '+(p.life==='SSL'?available(p):p.closingWaste)+' '+p.unit));const reasons=e('div');function draw(){reasons.replaceChildren();reasonButtons(reasons,['Upływ terminu ważności','Uszkodzenie','Jakość','Degustacja','Inny powód'],reason,v=>{reason=v;draw();validate();});}draw();body.append(reasons);const file=e('input');file.type='file';file.accept='image/*';file.setAttribute('aria-label','Zdjęcie odpadu');file.onchange=()=>{photo=!!file.files.length;validate();};body.append(e('p','Zdjęcie wymagane'),file);$('save').textContent=pending.length===1?'Potwierdź i zamknij dzień':'Potwierdź · następny produkt';function validate(){$('save').disabled=!reason||!photo;}validate();},()=>{p.proof=true;closeDialog();confirmClosing();});}
$('back').onclick=()=>{if(stage>0){stage--;render();window.scrollTo(0,0);}};$('next').onclick=()=>{if(stage===5){confirmClosing();return;}if(stage===2)opened=true;stage++;furthest=Math.max(furthest,stage);render();window.scrollTo(0,0);};render();
</script></html>
